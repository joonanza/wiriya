<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จองรถ · ประเมินราคา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1 id="bizName">จองรถ</h1>
  </header>

  <main class="layout reorder">
    <section>
      <div class="card" id="routeCard">
        <h2>เส้นทาง</h2>
        <div class="field">
          <label for="pickup"><span class="dot a"></span>จุดรับ</label>
          <div class="place-input">
            <input id="pickup" autocomplete="off" placeholder="ค้นหาสถานที่ หรือแตะบนแผนที่">
            <button class="icon" id="gpsBtn" type="button" title="ใช้ตำแหน่งปัจจุบัน" aria-label="ใช้ตำแหน่งปัจจุบัน">📍</button>
          </div>
          <ul class="suggest" id="pickupSuggest" hidden></ul>
        </div>
        <div class="field">
          <label for="dropoff"><span class="dot b"></span>จุดส่ง</label>
          <div class="place-input">
            <input id="dropoff" autocomplete="off" placeholder="ค้นหาสถานที่ หรือแตะบนแผนที่">
            <button class="icon" id="swapBtn" type="button" title="สลับจุดรับ-ส่ง" aria-label="สลับจุดรับ-ส่ง">⇅</button>
          </div>
          <ul class="suggest" id="dropoffSuggest" hidden></ul>
        </div>
        <div class="row">
          <div class="field"><label for="vehicle">ประเภทรถ</label><select id="vehicle"></select></div>
          <div class="field"><label for="datetime">วัน-เวลารับ</label><input id="datetime" type="datetime-local"></div>
        </div>
        <div class="row">
          <div class="field"><label for="toll">ค่าทางด่วน (฿)</label><input id="toll" type="number" min="0" step="5" value="0" inputmode="numeric"></div>
          <div class="field"><label for="wait">ค่ารอ (ชั่วโมง)</label><input id="wait" type="number" min="0" step="0.5" value="0" inputmode="decimal"></div>
        </div>
        <label class="check"><input type="checkbox" id="roundTrip"> ไป-กลับ</label>
        <label class="check"><input type="checkbox" id="airport"> รับ/ส่งสนามบิน</label>
      </div>

      <div class="card" id="quoteCard">
        <h2 id="quoteTitle">ราคาประเมิน</h2>
        <div id="quote"><p class="empty">เลือกจุดรับและจุดส่งเพื่อดูราคา</p></div>
      </div>

      <div class="card" id="bookCard" hidden>
        <h2>ข้อมูลผู้จอง</h2>
        <p class="muted" id="welcomeBack" hidden></p>
        <div class="field"><label for="custName">ชื่อ</label><input id="custName" autocomplete="name"></div>
        <div class="row">
          <div class="field"><label for="custPhone">เบอร์โทร</label><input id="custPhone" type="tel" autocomplete="tel" inputmode="tel"></div>
          <div class="field"><label for="custLine">LINE ID</label><input id="custLine" autocomplete="off" autocapitalize="off"></div>
        </div>
        <div class="field"><label for="custNote">หมายเหตุ (จำนวนคน, สัมภาระ, เที่ยวบิน)</label><textarea id="custNote" rows="2"></textarea></div>
        <label class="check"><input type="checkbox" id="rememberMe" checked> จดจำข้อมูลของฉันในเครื่องนี้</label>
        <button type="button" class="primary big-btn" id="submitBtn" hidden>📨 ส่งคำขอจอง</button>
        <div class="success" id="successBox" hidden></div>
        <div class="actions" id="altActions">
          <a class="btn" id="lineBtn" target="_blank" rel="noopener" hidden>ส่งทาง LINE</a>
          <button type="button" id="copyBtn" hidden>คัดลอกรายละเอียด</button>
          <a class="btn" id="callBtn" hidden>โทร</a>
        </div>
        <p class="notice" id="lineHint" hidden></p>
        <p class="muted" id="priceNote"></p>
      </div>

      <div class="card" id="myRequestsCard" hidden>
        <h2>คำขอที่เคยส่ง</h2>
        <div id="myRequests" class="my-requests"></div>
      </div>
    </section>

    <section id="mapSection">
      <div id="map" role="application" aria-label="แผนที่"></div>
      <p class="map-hint">แตะบนแผนที่เพื่อปักจุดรับ แล้วแตะอีกครั้งเพื่อปักจุดส่ง ลากหมุดเพื่อปรับตำแหน่งได้</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/customer.js"></script>
</body>
</html>
