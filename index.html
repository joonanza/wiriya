<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>หน้าแรก · คนขับ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1 id="bizName">หน้าแรก</h1>
    <nav>
      <a href="index.html" aria-current="page">หน้าแรก</a>
      <a href="quote.html">เสนอราคา</a>
      <a href="history.html">ประวัติ</a>
      <a href="customers.html">ลูกค้า</a>
      <a href="dashboard.html">แดชบอร์ด</a>
      <a href="admin.html">ตั้งค่า</a>
    </nav>
  </header>

  <main class="narrow">
    <section class="hero">
      <div>
        <div class="muted" id="today"></div>
        <h2 class="hero-title" id="greeting">สวัสดีครับ</h2>
      </div>
      <a class="btn primary big-btn" href="quote.html">+ เสนอราคาใหม่</a>
    </section>

    <a class="card alert-card" id="requestAlert" href="history.html?status=request" hidden></a>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <div class="card-head"><h2>งานที่จะถึง</h2><a class="link-btn" href="history.html?status=confirmed">ดูทั้งหมด</a></div>
      <div id="upcoming" class="list compact"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>รอลูกค้ายืนยัน</h2><a class="link-btn" href="history.html?status=sent">ดูทั้งหมด</a></div>
      <div id="pending" class="list compact"></div>
    </div>

    <div class="card">
      <h2>ลิงก์ให้ลูกค้าจอง</h2>
      <p class="muted">ส่งลิงก์นี้ให้ลูกค้า แล้วคำขอจองจะเด้งเข้ามาในแอปนี้</p>
      <div class="toolbar">
        <input id="custLink" readonly>
        <button type="button" id="shareLink">แชร์</button>
      </div>
      <div class="actions" id="notifyRow" hidden>
        <button type="button" id="notifyBtn">🔔 เปิดการแจ้งเตือนบนมือถือ</button>
      </div>
      <p class="muted" id="notifyNote"></p>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/home.js"></script>
</body>
</html>
